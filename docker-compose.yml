---
services:
  aws-emulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: aws-emulator:latest
    container_name: aws-emulator-ct
    restart: unless-stopped
    env_file: aws.env
    ports:
      - 127.0.0.1:9297:9297
    volumes:
      - ./.aws/emulator:/home/emulator/.aws/emulator
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://127.0.0.1:9297/__admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
